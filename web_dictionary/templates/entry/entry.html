{% extends 'base.html' %}

{% block content %}
    <div class="results">
        <div class="resource-results-container">
            {% for entry in entries %}
                <article id="{{ entry.uuid }}" class="article">
                    <header class="entry-header" role="banner">
                        <div class="entry-header-container">
                            <h1 class="entry-header-title">
                                {{ entry.name }}<sup>{{ forloop.counter }}</sup>
                            </h1>
                        </div>
                    </header>

                    <section class="entry-main-properties">
                        {% include 'entry/partials/entry_main_properties.html' with properties=entry.properties %}
                    </section>
                </article>
            {% endfor %}
        </div>
    </div>
{% endblock %}
